name: Release

# AUCUN declencheur automatique ne marche sur un tag anterieur a ce fichier :
#   `push: tags`         charge le workflow AU COMMIT DU TAG
#   `release: published` le charge AU TAG DE LA RELEASE, et non sur la branche par
#                        defaut comme on le croit souvent (GITHUB_SHA vaut le commit
#                        tague, GITHUB_REF vaut refs/tags/<tag>)
# Verifie le 29/09/2026 : une release creee a la main sur le tag 0.1.0 de
# fq-restrain-movement n'a rien declenche, ce tag n'ayant pas de dossier .github.
#
# Pour republier un tel tag, la SEULE voie est `workflow_dispatch` depuis la branche
# par defaut, en passant le tag dans `tag` : le workflow vient de la branche, et
# `actions/checkout` va chercher l'arbre du tag.
#
# Le `concurrency` plus bas absorbe les declenchements en double : le 29/09/2026, un
# seul push du tag 3.0.0 a produit deux runs, tous deux de type `push`.
on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant a (re)publier, ex. v3.0.0"
        required: true
      latest:
        description: "Marquer comme release 'Latest' (decocher pour retro-publier une ancienne version)"
        type: boolean
        default: true
      skip_checks:
        description: "Sauter lint + tests (retro-publication d'un vieux tag uniquement)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

env:
  MODULE_ID: fq-restrain-movement

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Meme garde-fou que l'ancienne pipeline : pas de release sur du rouge.
      # Contournable seulement a la main, pour retro-publier un tag ancien.
      - name: Lint
        if: ${{ !inputs.skip_checks }}
        run: npm run lint

      - name: Test
        if: ${{ !inputs.skip_checks }}
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Resolve version and check module.json
        id: version
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION="$(jq -r '.version' module.json)"

          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG (version $VERSION) != module.json version $MANIFEST_VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build release package
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/package

          # On n'embarque que ce qui est utile au runtime Foundry.
          # Chaque entree n'est copiee QUE SI ELLE EXISTE : un tag ancien ne porte
          # pas forcement tout, et une copie rigide ferait echouer la
          # retro-publication.
          for item in src lang LICENSE README.md; do
            if [ -e "$item" ]; then
              cp -r "$item" dist/package/
            else
              echo "::notice::absent de ce tag, non embarque : $item"
            fi
          done

          # Le manifest pointe sur "latest" (Foundry y detecte les mises a jour),
          # le download est epingle sur ce tag (installation d'une version precise).
          jq \
            --arg manifest "$REPO_URL/releases/latest/download/module.json" \
            --arg download "$REPO_URL/releases/download/$TAG/$MODULE_ID.zip" \
            '.manifest = $manifest | .download = $download' \
            module.json > dist/package/module.json

          (cd dist/package && zip -r "../$MODULE_ID.zip" .)
          ls -l dist

      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Le fichier RELEASE.md decrit chaque version par un bloc « Update X.Y.Z: »
          # suivi de lignes indentees, jusqu'au prochain « Update » : meme format que
          # le RELEASE de fq-card-engine.
          # Les tags poses avant ce changement portent l'ancien format « ## vX.Y.Z » :
          # les deux marqueurs sont acceptes, sinon toute retro-publication d'un tag
          # ancien repartirait sur des notes auto-generees.
          awk -v v="$VERSION" '
            index($0, "Update ") == 1 || index($0, "## ") == 1 {
              if (found) exit
              if (index($0, "Update " v ":") == 1 || $2 == "v" v || $2 == v) { found = 1; next }
            }
            found
          ' RELEASE.md > dist/notes.md || true

          if [ -s dist/notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pas de bloc 'Update $VERSION:' dans RELEASE.md, notes auto-generees."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
          IS_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.latest }}
        run: |
          set -euo pipefail
          ARGS=(--title "$TAG" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          # Explicite : GitHub classe "Latest" par date de creation, donc
          # retro-publier une vieille version detournerait releases/latest/.
          if [ "$IS_LATEST" = "true" ]; then
            ARGS+=(--latest)
          else
            ARGS+=(--latest=false)
          fi

          if [ "$NOTES_FOUND" = "true" ]; then
            ARGS+=(--notes-file dist/notes.md)
          else
            ARGS+=(--generate-notes)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG deja existante : mise a jour des assets."
            gh release upload "$TAG" --clobber \
              "dist/$MODULE_ID.zip" \
              "dist/package/module.json"
          else
            gh release create "$TAG" "${ARGS[@]}" \
              "dist/$MODULE_ID.zip" \
              "dist/package/module.json"
          fi
