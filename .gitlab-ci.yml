stages:
  - test
  - lint
  - release

image: node:20

variables:
  RELEASE_DIR: "fq-restrain-movement" # Nom de l'archive de release

test:
  stage: test
  script:
    - echo "Running tests..."
    - npm install
    - npx vitest run --reporter=default --reporter=junit --outputFile=test-results.xml
    - echo "Tests complete."
  artifacts:
    when: always
    reports:
      junit: test-results.xml

lint:
  stage: lint
  script:
    - echo "Running ESLint..."
    - npm install
    - npm run lint
    - echo "ESLint complete."

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  only:
    - tags
  dependencies: []
  script:
    - apk update
    - apk add zip
    # On ne garde que ce qui est utile au runtime Foundry (module.json, src, lang, LICENSE, README).
    - rm -rf node_modules .git tests devNotes .idea .vscode
    - rm -f .babelrc .gitignore .gitlab-ci.yml package.json package-lock.json vitest.config.js eslint.config.js test-results.xml RELEASE.md *.iml
    - echo "Releasing the tag..."
    - zip -r $RELEASE_DIR.zip * # Création de l'archive ZIP
    - ls -lrt
  artifacts:
    paths:
      - $RELEASE_DIR.zip
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Created using the release-cli $EXTRA_DESCRIPTION'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: "fq-restrain-movement.zip"
          url: "https://gitlab.com/final-quest/fq-restrain-movement/-/jobs/$CI_JOB_ID/artifacts/raw/fq-restrain-movement.zip"
